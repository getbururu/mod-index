name: publish

# Builds index.json from main (state/, games/, policy/) when they or the
# indexer change, writes it into the pages branch and deploys the site
# from that branch. Bururu reads it over HTTPS from getbururu.github.io;
# each version in it pins the SHA-256 of its pack. When the list says the
# same as the published one, nothing is deployed.

on:
  push:
    branches: [main]
    paths: ['state/**', 'games/**', 'policy/**', 'tools/indexer/**']
  workflow_dispatch:

permissions: {}

# a newer waiting run replaces an older waiting one
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.build.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Is there a pages branch?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/branches/pages" --silent 2> err.txt; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q "HTTP 404" err.txt; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat err.txt
            exit 1
          fi
      - name: Check out the published site
        if: steps.pages.outputs.exists == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: pages
          path: site
          persist-credentials: false
      - name: Build
        id: build
        run: |
          set -euo pipefail
          mkdir -p site/v1
          go run ./tools/indexer build -site site/v1 -out "$RUNNER_TEMP/index" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/index/index.json" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.build.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: index
          path: ${{ runner.temp }}/index
          retention-days: 7

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # one writer of the pages branch at a time, shared with stats.yml
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
      # this checkout pushes the pages branch, and nothing else
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: site
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: index
          path: ${{ runner.temp }}/index
      - name: Write the index into the pages branch
        run: |
          set -euo pipefail
          (cd repo && go build -o "$RUNNER_TEMP/indexer" ./tools/indexer)
          cd site
          if git ls-remote --exit-code --heads origin pages > /dev/null; then
            git fetch -q --depth=1 origin pages
            git switch -q -C pages FETCH_HEAD
          else
            git switch -q --orphan pages
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          "$RUNNER_TEMP/indexer" site -in "$RUNNER_TEMP/index" -site v1
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new for the site"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Publish the index"
            git push -q origin HEAD:refs/heads/pages
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
