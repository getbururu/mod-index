name: stats

# Daily: GitHub's download counts of the listed packs and the stars of
# their repos, written into the pages branch as stats.json beside the
# index, and the whole site deployed from it.

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  count:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.count.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Count
        id: count
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if ! gh api "repos/$GITHUB_REPOSITORY/contents/v1/index.json?ref=pages" --silent 2> /dev/null; then
            echo "no index is published yet"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          go run ./tools/indexer stats -out "$RUNNER_TEMP/stats" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - if: steps.count.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stats
          path: ${{ runner.temp }}/stats
          retention-days: 7

  deploy:
    needs: count
    if: needs.count.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # one writer of the pages branch at a time, shared with publish.yml
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
      # this checkout pushes the pages branch, and nothing else
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: site
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stats
          path: ${{ runner.temp }}/stats
      - name: Write the stats into the pages branch
        run: |
          set -eu
          (cd repo && go build -o "$RUNNER_TEMP/indexer" ./tools/indexer)
          cd site
          git fetch -q --depth=1 origin pages
          git switch -q -C pages FETCH_HEAD
          "$RUNNER_TEMP/indexer" site -in "$RUNNER_TEMP/stats" -site v1
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new for the site"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Publish the stats"
            git push -q origin HEAD:refs/heads/pages
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
